name: Accessibility evidence
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/accessibility.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt playwright
      - run: npm install --no-save axe-core
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/access.log 2>&1 &
          for i in $(seq 1 60); do curl --silent --fail http://127.0.0.1:8000/api/health && break; sleep .5; done
          python scripts/accessibility_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DECLIC-accessibility-audit
          path: accessibility-evidence/
