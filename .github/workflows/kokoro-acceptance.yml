name: Kokoro English audible acceptance
on:
  push:
    branches: ['feature/kokoro-english']
    paths: ['.github/workflows/kokoro-acceptance.yml', 'scripts/kokoro_acceptance.py', 'app/voice.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt -r requirements-voice.txt playwright kokoro-onnx==0.6.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils xvfb xauth espeak-ng
      - name: Download official Kokoro model and voice bank
        run: |
          mkdir -p voices/kokoro
          curl -fL --retry 2 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx -o voices/kokoro/kokoro-v1.0.onnx
          curl -fL --retry 2 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin -o voices/kokoro/voices-v1.0.bin
      - run: python -m pytest -q && node --check app/static/studio.js
      - name: Record real browser and voice playback
        run: |
          mkdir -p kokoro-evidence
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >kokoro-evidence/server.log 2>&1 &
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=declic
          pactl set-default-sink declic
          xvfb-run -a -s "-screen 0 1440x900x24" python scripts/kokoro_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DECLIC-Kokoro-English-recordings
          path: kokoro-evidence/
