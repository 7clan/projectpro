name: Two recorded main workflows - classroom and voice PDF
on:
  push:
    branches: [audit/main-classroom-recording]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recorded:
    strategy:
      fail-fast: false
      matrix:
        scenario: [classroom, voice_pdf]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TESTED_MAIN_SHA: 401c40e92199bb5b523cf518a53082cb3aeadd41
      GEMINI_API_KEY: ${{ secrets.GEMEINI }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      BAZAARLINK_API_KEY: ${{ secrets.SOME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 401c40e92199bb5b523cf518a53082cb3aeadd41
          path: target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r target/requirements-dev.txt -r target/requirements-voice.txt -r target/requirements-speech.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils xvfb xauth
      - name: Verify exact main and prepare local speech assets
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_MAIN_SHA"
          python -m pytest -q tests/test_course_expansion.py -k 'classroom or teacher_assignment'
          mkdir -p voices speech-models ../evidence
          python -m piper.download_voices --data-dir voices en_US-lessac-medium
          curl -fL --retry 2 https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o /tmp/vosk.zip
          unzip -q /tmp/vosk.zip -d speech-models
      - name: Generate two synthetic microphone utterances
        if: matrix.scenario == 'voice_pdf'
        working-directory: target
        run: |
          python - <<'PY'
          import asyncio,pathlib
          from app.voice import synthesize_preferred
          for i,text in enumerate(["What is the calibration code in the pendulum experiment?", "Explain how the length of a pendulum affects its period."],1):
              audio,_,backend=asyncio.run(synthesize_preferred(text,"en",[0]))
              assert backend=="piper-neural",backend
              pathlib.Path(f"../evidence/student-question-{i}.wav").write_bytes(audio)
          PY
      - name: Actual Chrome video and audio recording
        run: |
          export CLASSROOM_EVIDENCE="$PWD/evidence"
          export DECLIC_DB_PATH="$RUNNER_TEMP/declic-${{ matrix.scenario }}.sqlite3"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=declic
          pactl load-module module-null-sink sink_name=studentmic
          pactl set-default-sink declic
          pactl load-module module-remap-source master=studentmic.monitor source_name=declicmic source_properties=device.description=Declic_Test_Microphone
          pactl set-default-source declicmic
          pactl list short sources
          pactl list short sinks
          export PULSE_SOURCE=declicmic
          export PULSE_SINK=declic
          cd target
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >"$CLASSROOM_EVIDENCE/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep .5; done
          set +e
          xvfb-run -a -s "-screen 0 1440x900x24" env PYTHONPATH=. python ../scripts/record_main_${{ matrix.scenario }}.py
          code=$?
          tail -n 80 "$CLASSROOM_EVIDENCE/server.log"
          exit "$code"
      - name: Verify actual recorded streams
        if: always()
        run: |
          for file in evidence/*.mp4; do
            [ -f "$file" ] || continue
            ffprobe -v error -show_entries stream=codec_type,codec_name,duration -of json "$file"
            ffmpeg -hide_banner -i "$file" -vn -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | tee -a evidence/recording-volume.txt
          done
      - name: Require audible recording, not merely an audio stream
        if: always()
        run: |
          python - <<'PY'
          import pathlib,re
          p=pathlib.Path("evidence/recording-volume.txt")
          assert p.exists(), "No recorded audio measurement"
          peaks=re.findall(r"max_volume:\s*(-?[0-9.]+) dB",p.read_text())
          assert peaks and all(float(x)>-40 for x in peaks), f"Silent or inaudible recording: {peaks}"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DECLIC-main-${{ matrix.scenario }}-video-and-evidence
          path: evidence/
