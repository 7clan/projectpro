name: Full real app session — browser audio only
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/real-app-session.yml']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      BAZAARLINK_API_KEY: ${{ secrets.SOME }}
      GEMINI_API_KEY: ${{ secrets.GEMEINI }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt -r requirements-voice.txt playwright
      - run: mkdir -p voices && python -m piper.download_voices --data-dir voices fr_FR-siwis-medium en_US-lessac-medium
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils xvfb xauth espeak-ng
      - run: python -m pytest -q && node --check app/static/app.js && node --check app/static/studio.js
      - name: Record actual app with only live browser audio
        run: |
          mkdir -p app-session
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/walkthrough.log 2>&1 &
          for i in $(seq 1 60); do curl --silent --fail http://127.0.0.1:8000/api/health && break; sleep .5; done
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=declic
          pactl set-default-sink declic
          xvfb-run -a -s "-screen 0 1440x900x24" env PYTHONPATH=. python scripts/real_app_session.py
          ffmpeg -hide_banner -i app-session/DECLIC-real-app-session.mp4 -vn -af volumedetect -f null - 2>app-session/audio-check.txt
          grep max_volume app-session/audio-check.txt
          python -c "import re; assert float(re.search(r'max_volume: (-?[0-9.]+)',open('app-session/audio-check.txt').read()).group(1))>-50"
          ffprobe -v error -show_format -show_streams -of json app-session/DECLIC-real-app-session.mp4 >app-session/video-metadata.json
      - name: Safe diagnostics
        if: always()
        run: grep -E 'Cloud voice fallback|Cloud voice rate limited|OpenRouter speech|Provider .*failed|routing deadline|AI route success' /tmp/walkthrough.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DECLIC-real-app-session
          path: app-session/
