name: Live scientific visual and voice acceptance
on:
  push:
    branches: [quality/semantic-visual-validation]
    paths: ['.github/workflows/semantic-acceptance.yml', 'app/visual_checks.py', 'app/providers.py', 'app/whiteboard.py', 'app/voice.py', 'scripts/record_semantic_acceptance.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GEMINI_API_KEY: ${{ secrets.GEMEINI }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      BAZAARLINK_API_KEY: ${{ secrets.SOME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-voice.txt playwright
      - run: mkdir -p voices && python -m piper.download_voices --data-dir voices fr_FR-siwis-medium en_US-lessac-medium
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils xvfb xauth
      - name: Record real AI lessons in Chrome with app audio only
        run: |
          mkdir -p acceptance
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/semantic.log 2>&1 &
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=declic
          pactl set-default-sink declic
          xvfb-run -a -s "-screen 0 1440x900x24" env PYTHONPATH=. python scripts/record_semantic_acceptance.py
      - name: Safe diagnostics
        if: always()
        run: grep -E 'Provider .*failed|AI route success|Visual validation rejected|voice rate limited|speech fallback|routing deadline' /tmp/semantic.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-scientific-visual-acceptance
          path: acceptance/
