name: Statics Lab checkpoint video
on:
  workflow_dispatch:
  push:
    branches: ['test/statics-lab-5725549']
    paths: ['.github/workflows/statics-lab-acceptance.yml']
permissions:
  contents: read
jobs:
  statics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMEINI }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      BAZAARLINK_API_KEY: ${{ secrets.SOME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Real browser video and independent calculations
        run: |
          mkdir -p statics-evidence
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >statics-evidence/server.log 2>&1 &
          for i in $(seq 1 60); do curl --silent --fail http://127.0.0.1:8000/api/health && break; sleep .5; done
          python scripts/statics_lab_acceptance.py
      - name: Numerical regression
        if: always()
        run: python -m pytest -q tests/test_engine.py tests/test_api.py | tee statics-evidence/pytest.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DECLIC-statics-lab-video
          path: statics-evidence/
