name: Studio final audiovisual acceptance
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/studio-acceptance.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMEINI }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng pulseaudio pulseaudio-utils xvfb xauth
      - run: python -m pytest -q && node --check app/static/studio.js
      - name: Record actual Chrome window and audio together
        run: |
          mkdir -p acceptance
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/studio.log 2>&1 &
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=declic
          pactl set-default-sink declic
          xvfb-run -a -s "-screen 0 1440x900x24" python scripts/record_acceptance.py
      - name: Inspect captured audio streams
        if: always()
        run: |
          for f in acceptance/*.mp4; do
            [ -f "$f" ] || continue
            ffmpeg -hide_banner -i "$f" -af volumedetect -vn -f null - 2>"${f%.mp4}.audio.txt"
            grep -E 'mean_volume|max_volume' "${f%.mp4}.audio.txt" || true
          done
      - name: Safe provider diagnostics
        if: always()
        run: grep -E 'Provider .*failed|Gemini discovery|OpenRouter discovered|Model .*finish|Gemini model .*finish' /tmp/studio.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DECLIC-audiovisual-acceptance
          path: acceptance/
