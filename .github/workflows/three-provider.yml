name: Three provider acceptance
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/three-provider.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Live free-only generation and role separation
        env:
          BAZAARLINK_API_KEY: ${{ secrets.SOME }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          GEMINI_API_KEY: ${{ secrets.GEMEINI }}
          DECLIC_GEMINI_TEXT_FALLBACK: '0'
        run: |
          mkdir -p evidence
          python - <<'PY'
          import asyncio,json,logging,pathlib
          from app.whiteboard import generate
          from app.reviewer import review
          from app.providers import route
          from app.voice import _openrouter_render
          logging.basicConfig(level=logging.INFO)
          out=pathlib.Path("evidence")
          report={}
          def check(raw):
              obj=json.loads(raw[raw.index("{"):raw.rindex("}")+1])
              if obj.get("answer")!=25:raise ValueError("incorrect answer")
              return obj
          async def main():
              result=await route('Return only JSON {"answer":25} for 3 squared plus 4 squared.',check,budget=500,role="lesson")
              report["bazaarlink_probe"]={"passed":bool(result and result[1]=="bazaarlink"),"provider":result[1] if result else None,"model":result[2] if result else None}
              print("BAZAARLINK PROBE",report["bazaarlink_probe"],flush=True)
              lesson=await generate("Explique une file FIFO avec trois éléments A, B, C. Montre leur entrée et leur sortie dans le même ordre.","fr",[],[])
              report["lesson"]={"generated":bool(lesson),"provider":lesson.get("provider") if lesson else None,"model":lesson.get("model") if lesson else None}
              print("LESSON",report["lesson"],flush=True)
              if lesson:
                  (out/"lesson.json").write_text(json.dumps(lesson,ensure_ascii=False,indent=2))
                  result=await review("Explique une file FIFO.",lesson["steps"],lesson["model"])
                  report["review"]=result
                  print("REVIEW",result,flush=True)
              result=await route('Return only JSON {"answer":25} for 3 squared plus 4 squared.',check,budget=500,role="coach")
              report["coach"]={"passed":bool(result),"provider":result[1] if result else None,"model":result[2] if result else None}
              print("COACH",report["coach"],flush=True)
              (out/"results.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
              assert report["bazaarlink_probe"]["passed"], "BazaarLink key did not pass"
              assert report["lesson"]["generated"], "No live lesson"
              assert report["coach"]["passed"], "No live coach"
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DECLIC-three-provider-evidence
          path: evidence/
